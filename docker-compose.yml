name: steam-reviews-local

x-airflow: &airflow
  image: steam-reviews-airflow:local
  build:
    context: .
    dockerfile: Dockerfile.airflow
    args:
      PYSPARK_ARCHIVE: ${PYSPARK_ARCHIVE:-pyspark==3.5.5}
    additional_contexts:
      spark_archive: ${SPARK_ARCHIVE_DIR:-./data/raw}
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__PARALLELISM: "2"
    AIRFLOW__SCHEDULER__PARSING_PROCESSES: "1"
    AIRFLOW__WEBSERVER__WORKERS: "1"
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-local-steam-webserver}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://steam:${POSTGRES_PASSWORD:-steam_local}@postgres/airflow
    POSTGRES_HOST: postgres
    POSTGRES_USER: steam
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-steam_local}
    POSTGRES_DB: steam_reviews
    MINIO_ENDPOINT: minio:9000
    MINIO_ROOT_USER: ${MINIO_ROOT_USER:-steamadmin}
    MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-steam_local_minio}
    SPARK_THREADS: ${SPARK_THREADS:-2}
    SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-2g}
    SPARK_SHUFFLE_PARTITIONS: ${SPARK_SHUFFLE_PARTITIONS:-24}
    PLAYTIME_UNIT: ${PLAYTIME_UNIT:-minutes}
    SPARK_LOCAL_DIRS: /pipeline/scratch
    DBT_TARGET_PATH: /tmp/steam-dbt-target
    DBT_LOG_PATH: /tmp/steam-dbt-logs
  volumes:
    - ./airflow/dags:/opt/airflow/dags:ro
    - ./spark:/pipeline/spark:ro
    - ./dbt:/pipeline/dbt:ro
    - type: bind
      source: ${STEAM_DATA_DIR:-./data/raw}
      target: /pipeline/data/raw
      read_only: true
      bind:
        create_host_path: false
    - ./data/demo:/pipeline/data/demo:ro
    - ./SteamReviews/scratch:/pipeline/scratch
    - airflow-logs:/opt/airflow/logs

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: steam
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-steam_local}
      POSTGRES_DB: steam_reviews
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-postgres.sql:/docker-entrypoint-initdb.d/10-airflow.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U steam -d airflow"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: steam-reviews-minio:local
    build:
      context: .
      dockerfile: Dockerfile.minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-steamadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-steam_local_minio}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - "${MINIO_DATA_DIR:-minio-data}:/data"

  airflow-init:
    <<: *airflow
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://steam:${POSTGRES_PASSWORD:-steam_local}@postgres/airflow
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-steam_local}
    command: ["bash", "-ec", "airflow db migrate; if ! airflow users list --output json | python -c 'import json,sys; sys.exit(not any(u[\"username\"] == \"admin\" for u in json.load(sys.stdin)))'; then airflow users create --username admin --firstname Local --lastname Admin --role Admin --email admin@example.invalid --password \"$$AIRFLOW_ADMIN_PASSWORD\"; fi"]
    depends_on:
      postgres:
        condition: service_healthy

  airflow-scheduler:
    <<: *airflow
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      minio:
        condition: service_started

  airflow-webserver:
    <<: *airflow
    command: webserver
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8080}:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-data:
  minio-data:
  airflow-logs:
